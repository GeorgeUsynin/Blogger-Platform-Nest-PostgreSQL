version: '3.9'

services:
  app:
    build: .
    container_name: nest-bloggers_platform
    ports:
      - "443:3000"
    depends_on:
      postgres:
       condition: service_healthy
    environment:
      NODE_ENV: development

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USERNAME}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${DB_NAME_PG}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME} -d ${DB_NAME_PG}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
       condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs

  migrate:
    image: nest-app
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run migration:run

  app:
    build: .
    image: nest-app
    container_name: nest-bloggers_platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
       NODE_ENV: development
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${PG_USERNAME}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${DB_NAME_PG}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME} -d ${DB_NAME_PG}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
